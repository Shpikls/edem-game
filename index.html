<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Edem</title>
    <!-- Loader until the first render (SDK init and cloud saves can take
         seconds); React replaces #root's content, so it goes away by itself. -->
    <style>
      html {
        background-color: #164a84;
      }
      body {
        margin: 0;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        color: #eaf2ff;
        font: 14px/1 sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .boot__ring {
        width: 40px;
        height: 40px;
        border: 2px dashed rgb(234 242 255 / 0.45);
        border-top: 2px solid #eaf2ff;
        border-radius: 50%;
        animation: boot-spin 1.1s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status">
        <div class="boot__ring"></div>
        загрузка
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
