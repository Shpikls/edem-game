name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          # Yandex Metrika counter id (repo variable YM_ID); empty = no analytics
          VITE_YM_ID: ${{ vars.YM_ID }}
          # Umami (self-hosted at stats.shpikls.ru)
          VITE_UMAMI_ID: ${{ vars.UMAMI_ID }}
          VITE_UMAMI_URL: ${{ vars.UMAMI_URL }}
      # Yandex Games archive (download it from the run's artifacts)
      - run: npm run build:yandex
        env:
          VITE_YM_ID: ${{ vars.YM_ID }}
          VITE_UMAMI_ID: ${{ vars.UMAMI_ID }}
          VITE_UMAMI_URL: ${{ vars.UMAMI_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: edem-yandex
          path: dist-yandex
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
